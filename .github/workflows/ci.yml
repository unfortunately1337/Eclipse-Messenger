name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error -L "$release/gitleaks_8.30.1_linux_x64.tar.gz" -o gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error -L "$release/gitleaks_8.30.1_checksums.txt" -o checksums.txt
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan public history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml'
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --test sdk/eclipse-bot/index.test.mjs
      - run: npm run build
        env:
          REDIS_URL: redis://127.0.0.1:6379
